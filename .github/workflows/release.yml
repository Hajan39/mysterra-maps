name: Build map package

on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace an existing release of the same Protomaps build'
        type: boolean
        default: false
      only:
        description: 'Only these regions, comma-separated (empty = all)'
        type: string
        default: ''
  schedule:
    - cron: '0 4 3 * *' # monthly

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install go-pmtiles
        run: |
          curl -sSL -o pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          echo "PMTILES=$PWD/pmtiles" >> "$GITHUB_ENV"
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
          ONLY: ${{ inputs.only }}
        run: node build.mjs
