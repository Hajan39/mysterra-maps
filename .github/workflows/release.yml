name: Build CZ map package

on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace an existing release of the same Protomaps build'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 3 * *' # monthly

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install go-pmtiles
        run: |
          curl -sSL -o pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          echo "PMTILES=$PWD/pmtiles" >> "$GITHUB_ENV"
      - name: Build package
        run: node build.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./out/manifest.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" != "true" ]; then echo "v$VERSION already released"; exit 0; fi
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" out/cz.pmtiles out/assets.zip out/manifest.json \
            --title "CZ map $VERSION" \
            --notes "Czechia extract of Protomaps build $VERSION. Map data © OpenStreetMap contributors (ODbL), Protomaps. Fonts: Noto Sans (OFL)."
